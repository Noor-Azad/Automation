name: Tedile Production JavaScript Auth Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tedile-production-javascript-auth-smoke
  cancel-in-progress: false
jobs:
  production-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: javascript
    env:
      TEDILE_BASE_URL: https://tedile.in
      TEDILE_AUTH_MODE: production-smoke
      TEDILE_RUN_AUTHENTICATED: 'true'
      TEDILE_E2E_CUSTOMER_PHONE: ${{ secrets.TEDILE_E2E_CUSTOMER_PHONE }}
      TEDILE_E2E_CUSTOMER_OTP: ${{ secrets.TEDILE_E2E_CUSTOMER_OTP }}
    steps:
      - name: Checkout JavaScript migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/playwright-javascript-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dedicated production review credentials
        shell: bash
        run: |
          test -n "$TEDILE_E2E_CUSTOMER_PHONE" || { echo 'Missing TEDILE_E2E_CUSTOMER_PHONE secret'; exit 1; }
          test -n "$TEDILE_E2E_CUSTOMER_OTP" || { echo 'Missing TEDILE_E2E_CUSTOMER_OTP secret'; exit 1; }
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify JavaScript syntax
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Run allowlisted production smoke
        run: npx playwright test --project=chromium
      - name: Upload HTML report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-javascript-auth-smoke-report
          path: javascript/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
