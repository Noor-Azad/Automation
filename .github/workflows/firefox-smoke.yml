name: Firefox Smoke

on:
  pull_request:
    branches: [Test-Main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TEDILE_BASE_URL: https://tedile.in
      PLAYWRIGHT_BROWSER: firefox
      PLAYWRIGHT_HEADLESS: true
      PLAYWRIGHT_TRACE: true
      PLAYWRIGHT_VIDEO: false
      TEDILE_E2E_CUSTOMER_PHONE: ${{ secrets.TEDILE_E2E_CUSTOMER_PHONE }}
      TEDILE_E2E_CUSTOMER_OTP: ${{ secrets.TEDILE_E2E_CUSTOMER_OTP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tedile.Automation.sln

      - name: Build
        run: dotnet build Tedile.Automation.sln --configuration Release --no-restore

      - name: Install Playwright Firefox
        shell: pwsh
        run: tests/Tedile.Automation.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps firefox

      - name: Run Firefox smoke tests
        run: dotnet test Tedile.Automation.sln --configuration Release --no-build --filter "TestCategory=FirefoxSmoke" --logger "trx;LogFileName=firefox-smoke.trx" --results-directory TestResults

      - name: Upload Firefox smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-smoke-results-${{ github.run_number }}
          path: |
            TestResults/**
            artifacts/**
          if-no-files-found: ignore
          retention-days: 14
