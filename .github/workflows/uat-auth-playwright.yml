name: Tedile UAT Authenticated Playwright
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tedile-uat-authenticated
  cancel-in-progress: false
jobs:
  authenticated-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: javascript
    env:
      TEDILE_BASE_URL: https://tedile-uat.onrender.com
      TEDILE_RUN_AUTHENTICATED: 'true'
      TEDILE_E2E_CUSTOMER_PHONE: ${{ secrets.TEDILE_UAT_CUSTOMER_PHONE }}
      TEDILE_E2E_CUSTOMER_OTP: ${{ secrets.TEDILE_UAT_CUSTOMER_OTP }}
    steps:
      - name: Check out migration branch (not Test-Main)
        uses: actions/checkout@v4
        with:
          ref: migration/playwright-javascript-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm dedicated UAT credentials configured
        run: |
          test -n "$TEDILE_E2E_CUSTOMER_PHONE" || { echo 'Missing TEDILE_UAT_CUSTOMER_PHONE secret'; exit 1; }
          test -n "$TEDILE_E2E_CUSTOMER_OTP" || { echo 'Missing TEDILE_UAT_CUSTOMER_OTP secret'; exit 1; }
      - name: Install JS dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for Render UAT to be ready
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 40); do
            status=$(curl --silent --location --output /tmp/uat-response.html --write-out '%{http_code}' --max-time 20 "$TEDILE_BASE_URL/" || true)
            if [ "$status" = "200" ] && grep -q 'persona-customer' /tmp/uat-response.html; then
              echo "Tedile UAT customer login ready on attempt $attempt"
              ready=1
              break
            fi
            echo "UAT not ready (attempt $attempt, HTTP $status); waiting 10 seconds"
            sleep 10
          done
          if [ "$ready" != 1 ]; then
            echo "Tedile UAT did not serve its login screen within the readiness window."
            exit 1
          fi
      - name: Run UAT authenticated Playwright tests
        run: npx playwright test --project=chromium
      - name: Upload HTML test report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-authenticated-report
          path: javascript/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
