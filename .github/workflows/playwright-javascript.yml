name: Playwright JavaScript Migration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'javascript/**'
      - '.github/workflows/playwright-javascript.yml'
permissions:
  contents: read
jobs:
  javascript-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify JavaScript syntax
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Run public JavaScript Playwright tests
        env:
          TEDILE_BASE_URL: https://tedile.in
        run: npx playwright test --grep-invert '@manual'
      - name: Upload JavaScript report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-playwright-report
          path: javascript/playwright-report/
          retention-days: 14
