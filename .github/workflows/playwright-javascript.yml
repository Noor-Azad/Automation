name: Playwright JavaScript CI
on:
  pull_request:
    branches: [Test-Main]
  push:
    branches: [Test-Main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: javascript
    env:
      TEDILE_BASE_URL: https://tedile.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify JavaScript syntax
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Run public JavaScript tests
        run: npx playwright test --project=chromium
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-playwright-report
          path: javascript/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
  javascript-cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    defaults:
      run:
        working-directory: javascript
    env:
      TEDILE_BASE_URL: https://tedile.in
      TEDILE_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run public JavaScript smoke
        run: npx playwright test tests/public --project=${{ matrix.browser }}
